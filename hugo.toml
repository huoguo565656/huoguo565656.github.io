# =========================================================
#  博客站点配置（Hugo + PaperMod）
#  ⚠️ 想改站名/作者/描述，只动这一段 + 下面 [params] 里的 description
# =========================================================
baseURL      = "https://huoguo565656.github.io/"
title        = "技术笔记"
author       = "huoguo565656"
locale       = "zh-cn"
defaultContentLanguage = "zh-cn"
theme        = "PaperMod"
enableRobotsTXT = true
paginate     = 10
enableEmoji  = true

# 默认不构建草稿和未来时间的文章；写草稿时 frontmatter 里写 draft: true
buildDrafts  = false
buildFuture  = false
buildExpired = false

# ------------------------------------------------------------------
#  主题参数
# ------------------------------------------------------------------
[params]
  env             = "production"
  defaultTheme    = "auto"          # 跟随系统；读者可点导航栏切换明暗

  # ⚠️ 站点描述必须写在这里，不能写在文件顶部。
  # 顶层的 description 会被 Hugo 当成「语言级配置」（等同 [languages.zh-cn] description），
  # 不会进 site.Params；而 PaperMod 的 head.html 与 schema_json.html 读的都是
  # site.Params.description —— 写错位置的结果是 <meta name="description"> 静默变成空。
  description     = "用 Agent 做小工具的记录：把一个念头做成能跑的东西，写清思路、实现和踩过的坑。"

  # ---- 站内编辑器跳转 GitHub 用 ----
  # 在文章页进入「创造模式」后，点「去 GitHub 发布」会打开
  #   https://github.com/<repo>/edit/<repoBranch>/content/<源文件路径>
  # 在网页上改完提交，Actions 会自动重建站点。这是纯静态站最省事的发布路径：
  # 不需要在浏览器里放任何凭据。
  repo            = "huoguo565656/huoguo565656.github.io"
  repoBranch      = "main"

  # 日期格式。不设的话用主题默认的 :date_long，中文站会渲染成 "September 15, 2026"
  DateFormat      = "2006 年 1 月 2 日"
  ShowReadingTime = true
  ShowWordCount   = true
  ShowShareButtons = true
  ShowPostNavLinks = true
  ShowBreadCrumbs  = true
  ShowCodeCopyButtons = true
  ShowRssButtonInSectionTermList = true
  UseHugoToc      = true
  hideFooter      = false
  disableSpecial1stPost = false
  disableScrollToTop    = false
  hidemeta        = false
  hideSummary     = false
  showtoc         = true            # 文章内默认显示目录
  tocopen         = false           # 目录默认折叠
  comments        = false           # 暂时不接评论系统

  # 首页顶部那块自我介绍
  [params.homeInfoParams]
    Title   = "你好，欢迎翻我的笔记"
    Content = """
这里放**用 Agent 做小工具**的记录，不是资讯搬运站。

基本上每一篇都是一个「原来还能这么干」的念头，然后把它做成能跑的东西：

- **小巧思** —— 想到什么、为什么觉得可行、边界在哪
- **怎么实现的** —— 提示词、脚本、代码，能直接抄的
- **踩过的坑** —— 尤其是那种不记下来下次还会踩的

坦白讲，这里面不少功能，我以前觉得**以我的水平是做不出来的**。做出来了就攒在这儿，
接着往那些以前不敢想的方向试。
"""

  # 没有头像图片时留空即可；有图就放到 static/ 下再填路径
  [params.assets]
    disableHLJS = true              # 用 Hugo 内置高亮，不引外部 JS
    favicon     = "/favicon.ico"

  # 导航栏右侧的图标。要加就再复制一段 [[params.socialIcons]]
  [[params.socialIcons]]
    name = "github"
    url  = "https://github.com/huoguo565656"
  [[params.socialIcons]]
    name = "rss"
    url  = "index.xml"

# ------------------------------------------------------------------
#  导航栏
# ------------------------------------------------------------------
[[menu.main]]
  identifier = "posts"
  name       = "文章"
  url        = "posts/"
  weight     = 10
[[menu.main]]
  identifier = "archives"
  name       = "归档"
  url        = "archives/"
  weight     = 20
[[menu.main]]
  identifier = "tags"
  name       = "标签"
  url        = "tags/"
  weight     = 30
[[menu.main]]
  identifier = "search"
  name       = "搜索"
  url        = "search/"
  weight     = 40
[[menu.main]]
  identifier = "about"
  name       = "关于"
  url        = "about/"
  weight     = 50

# ------------------------------------------------------------------
#  Markdown / 代码高亮
# ------------------------------------------------------------------
[markup]
  [markup.goldmark.renderer]
    unsafe = true                   # 允许正文里写原生 HTML（表格、折叠块用得上）
  [markup.highlight]
    codeFences  = true
    guessSyntax = true
    lineNos     = false
    noClasses   = false             # PaperMod 要求 false：代码块要输出 class 给它自带的样式表用
    # ⚠️ 下面这个 style 对 PaperMod **不生效**，改它不会换代码配色。
    # PaperMod 不拿它去生成 CSS，而是直接用自带的
    #   themes/PaperMod/assets/css/includes/chroma-styles.css（深底 Catppuccin 配色）
    # 想换代码高亮配色，改那个文件。深底在明暗两种主题下都保持深底，是主题有意为之。
    style       = "github"

# 首页额外输出 JSON，给站内搜索用（content/search.md 依赖它）
# PaperMod 的搜索读的就是根目录的 index.json，不用自定义 output format
[outputs]
  home    = ["HTML", "RSS", "JSON"]
  # 每篇文章额外输出一份原始 Markdown（/posts/<slug>/index.md）
  # 用途：站内编辑器要读原文。见下方 outputFormats.Raw 与 layouts/_default/raw.md
  page    = ["HTML", "Raw"]

# 原始 Markdown 输出格式。
# 由 layouts/_default/raw.md 用 os.ReadFile 读出源文件**逐字节**原样输出，
# 所以连 frontmatter 都在——站内编辑时能改标题和标签，不只是正文。
# notAlternative 是为了不生成 <link rel="alternate">（那会让它被当成订阅源）。
[outputFormats.Raw]
  mediaType      = "text/markdown"
  baseName       = "index"
  isPlainText    = true
  isHTML         = false
  notAlternative = true
