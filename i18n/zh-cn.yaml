# =========================================================
#  简体中文界面文案
#
#  为什么要单独建这个文件（而不是用主题自带的 i18n/zh.yaml）：
#    PaperMod 的 <html lang="{{ site.Language }}"> 取的是**语言键**，
#    要得到 lang="zh-cn" 就得把 Hugo 语言设成 zh-cn；
#    而 i18n 是按语言键找文件的，主题里只有 zh.yaml 没有 zh-cn.yaml，
#    于是界面会退回英文。
#    项目目录下的 i18n/ 会与主题的合并，所以这里补一份同名的即可两头兼顾。
# =========================================================

- id: prev_page
  translation: "上一页"

- id: next_page
  translation: "下一页"

- id: read_time
  translation:
    one : "1 分钟"
    other: "{{ .Count }} 分钟"

- id: words
  translation:
    one: "字"
    other: "{{ .Count }} 字"

- id: toc
  translation: "目录"

- id: translations
  translation: "语言"

- id: home
  translation: "主页"

- id: edit_post
  translation: "编辑"

- id: code_copy
  translation: "复制"

- id: code_copied
  translation: "已复制！"
